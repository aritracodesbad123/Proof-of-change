name: Request a check
description: Ask for a check of one public pull request. Python libraries only.
title: "Request a check: "
labels:
  - request-a-check
body:
  - type: markdown
    attributes:
      value: |
        Paste one public GitHub pull request link for a Python library.
        The checker runs on the project machine, one request at a time.
        It does not start between 10:40 and 12:30 IST, and it stops after the daily limit.
        GitHub emails you when the verdict is posted. Finished checks are also on the results page.
  - type: input
    id: pr
    attributes:
      label: Public GitHub pull request link
      description: Python libraries only. One link, like https://github.com/owner/repo/pull/123
      placeholder: https://github.com/owner/repo/pull/123
    validations:
      required: true
