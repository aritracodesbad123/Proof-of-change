name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read   # read-only token: CI never posts, files or pushes anything

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BR_MACHINE: github-actions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the decision-log check can compare with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record runner machine type
        run: |
          python -m harness.machine | tee machine-type.json
          {
            echo "### Runner machine type (Python ${{ matrix.python }})"
            echo '```json'; cat machine-type.json; echo '```'
            echo "nproc: $(nproc); $(grep -m1 'model name' /proc/cpuinfo || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: python -m pip install -e ".[dev]" uv
      - name: Install pdftotext (the public-hygiene test reads PDF text) and bubblewrap (the sandbox)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap (Ubuntu restricts them through AppArmor)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --symlink usr/bin /bin --proc /proc --dev /dev --tmpfs /tmp -- /bin/true && echo "sandbox works" || echo "::warning::bubblewrap cannot start here; the sandbox tests will skip"
      - name: Decision log - a PR that changes code adds docs/decisions/YYYY-MM-DD-<topic>.md
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python -m guardrails.decision_log --base "origin/${{ github.base_ref }}"
      - name: Lint
        run: ruff check .
      - name: Guardrail - no external side effects
        run: python -m guardrails.no_external .
      - name: Tests
        run: pytest -q
      - name: Evals (strict v1 schema, all golden cases required)
        run: python -m evals.run_evals --observations evals/fixtures/golden_v1.jsonl --require-golden --require-v1 --out eval-results.json
      - name: Reviewer reports (HTML + daily summary)
        if: always() && hashFiles('eval-results.json') != ''
        run: |
          python -m reports.generate eval-results.json --out reports/runs/ci-py${{ matrix.python }} --claims-dir evals/fixtures/claims --formats md,html --require-v1 --title "CI golden batch (Python ${{ matrix.python }})"
          cat reports/runs/ci-py${{ matrix.python }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-reports-py${{ matrix.python }}
          path: |
            machine-type.json
            eval-results.json
            reports/runs/ci-py${{ matrix.python }}/

  console-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Console UI tests and build
        working-directory: console/web
        run: |
          npm ci
          npm test
          npm run build
