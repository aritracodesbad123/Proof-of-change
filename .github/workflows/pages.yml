name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - name: Build the replay console
        working-directory: console/web
        env:
          VITE_REPLAY: "1"
        run: |
          test -f ../../replay/catalog.json
          npm ci
          npm run build
          test -f dist/replay/catalog.json
          # The replay page must not ask the browser to load a font host.
          ! grep -q fonts.googleapis.com dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: console/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
