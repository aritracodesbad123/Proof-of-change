name: request-offline

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  note:
    if: github.event.action == 'opened' || github.event.label.name == 'request-a-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say when the checker has not checked in
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.issue.labels || []).map((label) => label.name)
            if (!labels.includes('request-a-check')) return
            if (labels.includes('request-done') || labels.includes('request-running')) return
            const maxMinutes = 20
            const marker = 'The checker is offline right now'
            let offline = true
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/checker-heartbeat.json',
                ref: 'checker-heartbeat',
              })
              const text = Buffer.from(res.data.content, 'base64').toString('utf8')
              const beat = JSON.parse(text)
              const age = Date.now() - Date.parse(beat.checked_in_at)
              if (Number.isFinite(age) && age >= 0 && age <= maxMinutes * 60 * 1000) offline = false
            } catch (error) {
              offline = true
            }
            if (!offline) return
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            if (existing.data.some((comment) => (comment.body || '').includes(marker))) return
            const owner = context.repo.owner
            const repo = context.repo.repo
            const body = [
              marker + ', so this request is waiting.',
              '',
              'Finished checks are on the results page:',
              `https://${owner}.github.io/${repo}/`,
              '',
              'When the checker is running on the project machine, it will pick this up. You do not need to open another request.',
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
