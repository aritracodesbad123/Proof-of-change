[project]
name = "blast-radius"
version = "0.1.0"
description = "Proof-of-Change: prove what a PR claims by running it on main and on the PR. Plus the downstream-test harness, evals, guardrails and approver reports."
requires-python = ">=3.11"
dependencies = []  # stdlib only; the runner shells out to uv and git

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ops = ["uv>=0.4"]  # the PR runner creates its test environments with uv

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["poc", "harness", "evals", "guardrails", "reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["harness/br_run.py"]  # Jonathan's runner, linted by its owner

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E702"]
