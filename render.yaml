# Free-tier web service: https://dashboard.render.com → New → Blueprint
# Set secret NEBIUS_API_KEY in the Render dashboard (Token Factory).
# RENDER_GIT_COMMIT is injected by Render (stamps runs; image has no .git).
# A hosted console runs pull-request code only in Contree (--require-contree). It never
# falls back to local bubblewrap or runs unsandboxed: without a usable Nebius key and
# project ID the check refuses with "Contree unavailable" (could not verify).
# After deploy you get https://<name>.onrender.com — open it like GCP.
#
# Note: free instances sleep when idle (~1 min cold start). Heavy PR checks
# may hit the free timeout; fine for demos / short runs.

services:
  - type: web
    name: poc-console
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_PROJECT_ID
        sync: false
      # Read-only classic PAT or fine-grained (public_repo / Contents+Pull requests read).
      # Without it, Render’s shared IP hits GitHub’s anonymous 60/hour limit.
      - key: GITHUB_TOKEN
        sync: false
      - key: POC_DEMO_REPOS
        sync: false
      - key: PORT
        value: "8787"
      # Sign-in. Leave unset until you have the values. Do not set POC_OTP_TEST_SINK.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: POC_ADMIN_EMAIL
        sync: false
      - key: POC_SIGNUP_DISABLED
        sync: false
      - key: POC_INVITE_CODE
        sync: false
      - key: POC_PUBLIC_URL
        sync: false
