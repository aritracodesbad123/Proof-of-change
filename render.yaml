# Free-tier web service: https://dashboard.render.com → New → Blueprint
# Set secret NEBIUS_API_KEY in the Render dashboard (Token Factory).
# RENDER_GIT_COMMIT is injected by Render (stamps runs; image has no .git).
# bwrap uid maps fail on free Render → console auto-uses --unsafe-no-sandbox
# unless NEBIUS_PROJECT_ID is set (Contree) or POC_UNSAFE_NO_SANDBOX=0.
# After deploy you get https://<name>.onrender.com — open it like GCP.
#
# Note: free instances sleep when idle (~1 min cold start). Heavy PR checks
# may hit the free timeout; fine for demos / short runs.

services:
  - type: web
    name: poc-console
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_PROJECT_ID
        sync: false
      # Read-only classic PAT or fine-grained (public_repo / Contents+Pull requests read).
      # Without it, Render’s shared IP hits GitHub’s anonymous 60/hour limit.
      - key: GITHUB_TOKEN
        sync: false
      - key: POC_DEMO_REPOS
        sync: false
      - key: PORT
        value: "8787"
      # Password sign-in emails a code. Leave unset and password sign-in is refused.
      # Do not set POC_OTP_TEST_SINK here. That test switch is refused on Render.
      - key: POC_SMTP_HOST
        sync: false
      - key: POC_SMTP_PORT
        sync: false
      - key: POC_SMTP_USER
        sync: false
      - key: POC_SMTP_PASSWORD
        sync: false
      - key: POC_SMTP_FROM
        sync: false
      # Optional. A provider button stays hidden until both of its values are set.
      # Register /api/auth/google/callback and /api/auth/github/callback on the provider.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: POC_PUBLIC_URL
        sync: false
